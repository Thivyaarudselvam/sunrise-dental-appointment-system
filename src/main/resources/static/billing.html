<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billing - Sunrise Dental Clinic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <h1>Sunrise Dental Clinic</h1>
  <div>
    <a href="dashboard.html">Dashboard</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2>Generate Bill</h2>
    <label>Appointment Number</label>
    <input type="number" id="apptNumber" placeholder="e.g. 1">
    <button onclick="generateBill()">Generate Bill</button>
    <div class="msg" id="msg"></div>

    <div class="bill-view" id="billView" style="display:none">
      <h2 style="border:none;margin-bottom:8px">Sunrise Dental Clinic - Receipt</h2>
      <p><strong>Bill ID:</strong> <span id="billId"></span></p>
      <p><strong>Patient:</strong> <span id="billPatient"></span></p>
      <p><strong>Treatment:</strong> <span id="billTreatment"></span></p>
      <p><strong>Consultation Fee:</strong> LKR <span id="billConsult"></span></p>
      <p><strong>Treatment Cost:</strong> LKR <span id="billTreatCost"></span></p>
      <p class="bill-total">Total Amount: LKR <span id="billTotal"></span></p>
      <button class="secondary" onclick="window.print()">Print Bill</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
requireLogin();

async function generateBill() {
  const num = document.getElementById('apptNumber').value;
  const msg = document.getElementById('msg');
  const billView = document.getElementById('billView');

  if (!num) {
    showMsg(msg, 'Please enter an appointment number.', true);
    return;
  }

  const res = await fetch(API_BASE + '/bills/generate/' + num, { method: 'POST' });

  if (res.ok) {
    const bill = await res.json();
    msg.style.display = 'none';
    billView.style.display = 'block';
    document.getElementById('billId').textContent = bill.billId;
    document.getElementById('billPatient').textContent = bill.appointment.patient.name;
    document.getElementById('billTreatment').textContent = bill.appointment.treatment.treatmentName;
    document.getElementById('billConsult').textContent = bill.consultationFee;
    document.getElementById('billTreatCost').textContent = bill.treatmentCost;
    document.getElementById('billTotal').textContent = bill.totalAmount;
  } else {
    billView.style.display = 'none';
    showMsg(msg, 'Could not generate bill. Check the appointment number.', true);
  }
}
</script>
</body>
</html>
