<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Sunrise Dental Clinic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrapper">
  <div class="login-box">
    <h1>Sunrise Dental Clinic</h1>
    <p>Appointment &amp; Patient Management System</p>

    <label>Username</label>
    <input type="text" id="username" placeholder="e.g. admin">

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">

    <button onclick="login()" style="width:100%">Login</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');

  if (!username || !password) {
    showMsg(msg, 'Please enter username and password.', true);
    return;
  }

  try {
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (res.ok) {
      sessionStorage.setItem('loggedInUser', username);
      window.location.href = 'dashboard.html';
    } else {
      showMsg(msg, data.message || 'Login failed.', true);
    }
  } catch (e) {
    showMsg(msg, 'Cannot reach server. Is the app running?', true);
  }
}
</script>
</body>
</html>
